<?xml version="1.0" encoding="UTF-8"?>
<!-- Xorssaint fork crescent moon mark. Not affiliated with the upstream Vorssaint project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="324" viewBox="0 0 640 324">
  <defs>
    <mask id="moonMask" maskUnits="userSpaceOnUse" x="-320" y="-320" width="640" height="640">
      <rect x="-320" y="-320" width="640" height="640" fill="#000000"/>
      <circle cx="0" cy="0" r="300" fill="#ffffff"/>
      <circle cx="110" cy="-80" r="255" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(320 162) scale(0.44) rotate(15)">
    <rect x="-320" y="-320" width="640" height="640" fill="#ffffff" mask="url(#moonMask)"/>
  </g>
</svg>
